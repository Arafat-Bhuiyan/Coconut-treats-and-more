<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coconut Treats &amp; More — Mobile Screen Poster Template</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f2f6f0;
      font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .toolbar {
      max-width: 330px;
      margin: 6px auto 6px auto;
      background: #1F291E;
      color: #ffffff;
      padding: 9px 11px;
      border-radius: 12px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.14);
    }
    .toolbar button, .toolbar a.dl-btn {
      background: #97BC62;
      color: #1F291E;
      border: none;
      padding: 7px 6px;
      border-radius: 7px;
      font-weight: 800;
      font-size: 11px;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      display: inline-block;
    }
  </style>
</head>
<body>

  <!-- Compact 1-Click Copy Toolbar -->
  <div class="toolbar">
    <div style="margin-bottom: 5px; font-size: 11px; color: #cfe3c4; line-height: 1.3;">
      <strong style="color:#fff; font-size:11.5px;">📱 Mobile 1-Screen Poster Template</strong><br/>
      Subject: <b>🥥 Fresh Homemade Coconut Pudding — Flat ৳100 OFF!</b>
    </div>
    <div style="display:flex; gap:4px; width:100%;">
      <button style="flex:1;" onclick="copySubject(this)">📋 Subject</button>
      <button style="flex:1.3;" onclick="copyVisualEmail(this)">📋 Copy Email</button>
      <button style="flex:1.4; background:#25D366; color:#fff;" onclick="copyWhatsAppMsg(this)">💬 WhatsApp</button>
      <a class="dl-btn" style="flex:0.9; background:#FFF8E7;" href="/email-poster.jpg" download="Coconut-Pudding-Poster.jpg">📥 Poster</a>
    </div>
  </div>

  <!-- START OF MOBILE 1-SCREEN POSTER EMAIL (Fits 100% inside mobile screen when opened!) -->
  <div id="email-content-area" style="padding: 2px;">
    <table role="presentation" width="265" cellspacing="0" cellpadding="0" border="0" align="center" style="width: 265px; max-width: 265px; margin: 0 auto; background-color: #ffffff; border-radius: 14px; overflow: hidden; border: 1.5px solid #cfe0c7; font-family: 'Segoe UI', Arial, sans-serif; box-shadow: 0 4px 14px rgba(31,41,30,0.08);">
      
      <!-- 1. ONLY THE POSTER (Full Card Width, Sized to Fit 1 Mobile Screen!) -->
      <tr>
        <td align="center" style="background-color: #f4f9f1; padding: 5px 5px 4px 5px;">
          <a href="https://coconuttreatsmore.com/" target="_blank" style="text-decoration: none; display: block;">
            <img src="https://coconuttreatsmore.com/email-poster.jpg" alt="Coconut Treats &amp; More — Fresh Homemade Coconut Pudding" width="252" style="width: 252px; max-width: 252px; height: auto; display: block; margin: 0 auto; border-radius: 10px; border: 0;" />
          </a>
        </td>
      </tr>

      <!-- 2. ULTRA-SHORT 2-LINE OFFER (Single-Line Bangla + Single-Line English Price) -->
      <tr>
        <td align="center" style="padding: 4px 6px 5px 6px; text-align: center; background-color: #ffffff;">
          <div style="font-size: 11px; font-weight: 800; color: #1F291E; line-height: 1.25; margin-bottom: 3px; white-space: nowrap;">
            🥥 ১০০% তাজা ডাবের পুডিং • <span style="color:#4A6741;">২ বক্সে ১০০ টাকা ছাড়!</span>
          </div>
          <div style="font-size: 10.5px; font-weight: 800; color: #1F291E; background-color: #FFFDF5; border: 1px dashed #4A6741; border-radius: 6px; padding: 3px 4px; line-height: 1.3; white-space: nowrap;">
            📦 1 Box: ৳750 | 🔥 2 Boxes: <strong style="color:#4A6741;">৳1,400 (৳100 OFF)</strong>
          </div>
        </td>
      </tr>

      <!-- 3. COMPACT CLICKABLE ORDER BUTTONS (Fits inside the same mobile screen!) -->
      <tr>
        <td style="padding: 0 6px 6px 6px; background-color: #ffffff;">
          <!-- Website Button -->
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="margin-bottom: 4px;">
            <tr>
              <td align="center">
                <a href="https://coconuttreatsmore.com/" target="_blank" style="display: block; background-color: #4A6741; color: #ffffff; font-size: 11px; font-weight: 900; text-decoration: none; padding: 6px 4px; border-radius: 6px; text-align: center; white-space: nowrap;">
                  🛒 Order: coconuttreatsmore.com ➔
                </a>
              </td>
            </tr>
          </table>

          <!-- WhatsApp & Call Row -->
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
            <tr>
              <td width="50%" style="padding-right: 2px;">
                <a href="https://wa.me/8801618562844?text=Hello!%20I%20want%20to%20order%20Coconut%20Pudding." target="_blank" style="display: block; background-color: #25D366; color: #ffffff; font-size: 10.5px; font-weight: 900; text-decoration: none; padding: 6px 3px; border-radius: 6px; text-align: center; white-space: nowrap;">
                  💬 WhatsApp
                </a>
              </td>
              <td width="50%" style="padding-left: 2px;">
                <a href="tel:+8801618562844" style="display: block; background-color: #FFF8E7; color: #1F291E; border: 1px solid #eab308; font-size: 10.5px; font-weight: 900; text-decoration: none; padding: 5px 3px; border-radius: 6px; text-align: center; white-space: nowrap;">
                  📞 +8801618562844
                </a>
              </td>
            </tr>
          </table>
        </td>
      </tr>

    </table>
  </div>
  <!-- END OF MOBILE 1-SCREEN POSTER EMAIL -->

  <script>
    function copySubject(btn) {
      const subject = "🥥 Fresh Homemade Coconut Pudding — Flat ৳100 OFF!";
      navigator.clipboard.writeText(subject);
      const old = btn.innerText;
      btn.innerText = "✓ Copied!";
      setTimeout(() => btn.innerText = old, 2000);
    }

    function copyVisualEmail(btn) {
      const area = document.getElementById('email-content-area');
      const range = document.createRange();
      range.selectNode(area);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      document.execCommand('copy');
      sel.removeAllRanges();
      const old = btn.innerText;
      btn.innerText = "✓ Copied!";
      setTimeout(() => btn.innerText = old, 2500);
    }

    function copyWhatsAppMsg(btn) {
      const msg = `🥥 *100% Fresh Homemade Coconut Pudding!* (তাজা ডাবের পানি ও শাঁসে তৈরি)
📦 *1 Box:* ৳750 | 🔥 *2 Boxes:* ৳1,400 *(৳100 OFF!)* | 🚚 *5+:* FREE Delivery
🛒 *Order:* https://coconuttreatsmore.com/ | 📞 *Call/WA:* +8801618562844`;
      navigator.clipboard.writeText(msg);
      const old = btn.innerText;
      btn.innerText = "✓ Copied!";
      setTimeout(() => btn.innerText = old, 2500);
    }
  </script>
</body>
</html>
